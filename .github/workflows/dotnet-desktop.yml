name: Build SQLCLR (.sqlproj) for .NET 4.5

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Install SSDT build targets (Microsoft.Data.Tools.Msbuild)
      run: |
        nuget install Microsoft.Data.Tools.Msbuild -Version 10.0.61804.210
        echo "##[group]Copy SSDT build targets"
        $pkg = Get-ChildItem . -Recurse -Filter Microsoft.Data.Tools.Msbuild.* | Select-Object -First 1
        $targets = Join-Path $pkg.FullName "build"
        echo "Using targets from: $targets"
        echo "##[endgroup]"
        echo "::set-output name=targets::$targets"
      shell: powershell

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build .sqlproj (Release)
      run: |
        msbuild JsonParser.sln /p:Configuration=Release /verbosity:minimal

    - name: Collect outputs
      run: |
        mkdir output
        if (Test-Path "JsonParser\bin\Release") { Copy-Item "JsonParser\bin\Release\*.*" output\ -Force }
        if (Test-Path "JsonParser\bin\Release\SqlClrJsonParser.dll") { Copy-Item "JsonParser\bin\Release\SqlClrJsonParser.dll" output\ -Force }
        if (Test-Path "JsonParser\bin\Release\JsonParser.dll") { Copy-Item "JsonParser\bin\Release\JsonParser.dll" output\ -Force }
        if (Test-Path "JsonParser\bin\Release\JsonParser.dacpac") { Copy-Item "JsonParser\bin\Release\JsonParser.dacpac" output\ -Force }
        if (Test-Path "JsonParser\Assemblies\Newtonsoft.Json.dll") { Copy-Item "JsonParser\Assemblies\Newtonsoft.Json.dll" output\ -Force }
      shell: powershell

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sqlclr-jsonparser-build
        path: output
